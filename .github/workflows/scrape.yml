name: Scrape latest episodes

# NOTE: there is deliberately no `schedule:` here.
#
# tamildhool.tech sits behind a Cloudflare challenge that blocks GitHub's
# hosted runners outright. Measured from a runner (IP 172.174.198.67): every
# request to the host returns 403 with `cf-mitigated: challenge` — bare curl,
# full browser headers, HTTP/1.1, the RSS feed and the wp-json API alike —
# while a control request to api.dailymotion.com returns 200. Clearing the
# challenge needs a real browser, so no header tweak fixes it.
#
# The daily refresh therefore runs from a machine on a residential
# connection; see "Daily refresh" in the README. This workflow is kept for
# manual runs and would start working as-is on a self-hosted runner.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No dependencies — the scraper is plain Node with built-in fetch.
      - run: node scripts/scrape.mjs

      - id: commit
        run: |
          if git diff --quiet -- data/shows.json; then
            echo "No episode changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows.json
          git commit -m "data: refresh latest episodes"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Only redeploy when the data actually moved.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
